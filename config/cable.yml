# Production broadcasts are consumed by both web and Sidekiq processes.
# Configure ACTION_CABLE_REDIS_URL to point at the persistent Redis service DB 3.

development:
  adapter: redis
  url: <%= ENV.fetch("ACTION_CABLE_REDIS_URL", "redis://localhost:6379/3") %>
  channel_prefix: brute_force_finder_app_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("ACTION_CABLE_REDIS_URL", "redis://redis:6379/3") %>
  channel_prefix: brute_force_finder_app_production
