x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: ruby:4.0.5-slim
  stdin_open: true
  tty: true
  volumes:
    - .:/app:cached
    - /app/node_modules
  environment:
    - RAILS_ENV=development
    - REDIS_URL=redis://redis:6379/1
    - SEARXNG_URL=http://searxng:8080
    - RUBY_GC_HEAP_INIT_SLOTS=10000
    - RUBY_GC_HEAP_GROWTH_FACTOR=1.2
    - RUBY_GC_HEAP_GROWTH_MAX_SLOTS=30000
    - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
  networks:
    - finder_network

services:
  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: finder_tor
    restart: always
    networks:
      - finder_network

  db:
    image: postgres:18.4-alpine
    container_name: finder_db
    stdin_open: true
    tty: true
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=password
    networks:
      - finder_network

  redis:
    image: redis:8.6.2-alpine
    container_name: finder_redis
    volumes:
      - redis_data:/data
    networks:
      - finder_network

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -q scraping -q default
    networks:
      - finder_network
    depends_on:
      - db
      - redis

  searxng:
    build:
      context: ./searxng
      dockerfile: Dockerfile
    image: searxng/searxng:latest
    container_name: finder_searxng
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_PROXIES_all=socks5h://tor:9050
    networks:
      - finder_network
    depends_on:
      - tor

  app:
    <<: *app
    container_name: finder_rails
    command: sh -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      searxng:
        condition: service_started

  js_watcher:
      <<: *app
      container_name: finder_js_watcher
      command: yarn build --watch
      depends_on:
        - app

  tailwind:
    <<: *app
    command: bin/rails tailwindcss:watch

volumes:
  postgres_data:
  redis_data:

networks:
  finder_network:
    driver: bridge
