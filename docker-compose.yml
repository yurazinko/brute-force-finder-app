networks:
  finder_network:
    driver: bridge

services:
  tor:
    image: peterdavehello/tor-socks-proxy:latest
    container_name: finder_tor
    networks:
      - finder_network
    # restart: unless-stopped

  db:
    image: postgres:18.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=password
    networks:
      - finder_network
    stdin_open: true
    tty: true

  redis:
    image: redis:8.6.2-alpine
    volumes:
      - redis_data:/data
    networks:
      - finder_network

  searxng:
    build:
      context: ./searxng
      dockerfile: Dockerfile
    image: searxng/searxng:latest
    container_name: finder_searxng
    command: tor -f /etc/tor/torrc --Log "info stdout"
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_PROXIES_all=socks5h://tor:9050
    networks:
      - finder_network
    depends_on:
      - tor
    # restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    stdin_open: true
    tty: true
    image: ruby:4.0.5-slim
    container_name: finder_rails
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/1
    networks:
      - finder_network
    depends_on:
      db:
        condition: service_started
      searxng:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data: